<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Incognito Mode Restricted - Bastiodon</title>
  <style>
    :root {
      --bg-pitch: #000000;
      --card-bg: rgba(18, 18, 20, 0.85);
      --card-border: rgba(255, 255, 255, 0.15);
      --card-glow: 0 0 35px rgba(255, 255, 255, 0.08);
      --text-white: #FFFFFF;
      --text-dim: #A1A1AA;
      --alert-red: #F43F5E;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-pitch);
      color: var(--text-white);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 24px;
    }

    .box {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      padding: 40px;
      border-radius: 20px;
      max-width: 500px;
      width: 100%;
      box-shadow: var(--card-glow);
      border: 1px solid var(--card-border);
    }

    .badge-icon {
      width: 68px;
      height: 68px;
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: var(--alert-red);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 20px;
      box-shadow: 0 0 25px rgba(244, 63, 94, 0.15);
    }

    h1 {
      color: var(--text-white);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 12px;
    }

    p {
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-dim);
    }

    .code {
      background: rgba(255, 255, 255, 0.04);
      border: 1px dashed rgba(255, 255, 255, 0.2);
      padding: 12px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 12px;
      margin: 20px 0;
      color: var(--text-white);
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="badge-icon">🔒</div>
    <h1>Incognito Access Restricted</h1>
    <p>
      Private and Incognito browsing is locked on this computer under your family's Bastiodon Cyber Safety policy.
    </p>
    <div class="code">
      Enforcement: Policy "IncognitoModeAvailability = 1"
    </div>
    <p>
      All browsing sessions must take place in standard windows with Bastiodon Guardian protection active.
    </p>
  </div>
</body>
</html>
